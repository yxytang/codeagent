[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcode-agent"
version = "0.1.0"
description = "Local multi-agent coding workspace with a DeepSeek-compatible provider"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
xcode = "xcode.server:main"
xcode-benchmark = "benchmarks.__main__:main"

[tool.setuptools.packages.find]
include = ["xcode*", "benchmarks*"]

[tool.setuptools.package-data]
xcode = ["static/*"]
